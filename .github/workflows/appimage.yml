name: Anylinux-AppImage
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
on:
  schedule:
    - cron: "0 7 1/21 * *" # rebuild every 21 days, change this to your liking
  workflow_dispatch: {}

jobs:
  build:
    name: "${{ matrix.name }} (${{ matrix.arch }})"
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runs-on: ubuntu-24.04, name: Build AppImage, arch: x86_64 }
          - { runs-on: ubuntu-24.04-arm, name: Build AppImage, arch: aarch64 }
    container: ghcr.io/pkgforge-dev/archlinux:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Preparing Container
        uses: pkgforge-dev/anylinux-setup-action@ba7321e11074f9e387a0634e653d09b115d576cd # v6
      - name: Install Dependencies
        run: /bin/sh ./appimage/get-dependencies.sh
      - name: Make AppImage
        run: /bin/sh ./appimage/make-appimage.sh
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AppImage-${{ matrix.arch }}
          path: dist

  release:
    if: >-
      ${{ !cancelled() && github.ref_name == 'main'
      && needs.build.result == 'success' }}
    needs: [build]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: AppImage-*
          merge-multiple: true
      - name: Release AppImage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          VERSION=$(awk -F'=' '/X-AppImage-Version/{print $2; exit}' ./appinfo 2>/dev/null || true)
          if [ -z "${VERSION-}" ]; then
            VERSION=$(basename "$(ls *.AppImage | head -n1)" | sed 's/^[^-]*-//;s/-anylinux-.*//')
          fi
          gh release create "$VERSION@$(date -u +'%Y-%m-%d_%s')" \
            --title "holesail: $VERSION" \
            --latest \
            --notes "AnyLinux AppImage built with quick-sharun from the holesail $VERSION release binaries." \
            *.AppImage *.zsync
